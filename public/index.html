<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#FAFAFA;--surface:#F0F0F0;--text:#111111;--text-muted:#666666;--text-dim:#999999;
  --accent:#D4FF00;--accent-hover:#c2eb00;--border:#E5E5E5;--border-light:#EEEEEE;--white:#FFFFFF;
  --green:#16a34a;--red:#dc2626;--blue:#2563eb;
}
html{-webkit-font-smoothing:antialiased;}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;letter-spacing:-0.01em;overflow-x:hidden;}
.header{position:sticky;top:0;z-index:100;background:rgba(250,250,250,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 1.25rem;height:56px;display:flex;align-items:center;justify-content:space-between;}
.header-logo{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;letter-spacing:-0.04em;}
.logo-mark{width:28px;height:28px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo-mark svg{width:16px;height:16px;}
.app{max-width:680px;margin:0 auto;padding:1.25rem 1rem 5rem;}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:1.5rem;overflow-x:auto;}
.tab{padding:10px 16px;cursor:pointer;font-size:13px;font-weight:600;letter-spacing:-0.01em;color:var(--text-muted);border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;letter-spacing:-0.01em;transition:color 0.2s;font-family:inherit;}
.tab.active{color:var(--text);border-bottom-color:var(--text);}
.tab:hover:not(.active){color:var(--text);}
.card{background:var(--white);border:1px solid var(--border);border-radius:16px;box-shadow:inset 0 1px 0 var(--white);padding:1.1rem 1.25rem;margin-bottom:1rem;}
.card-title{font-size:10px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.9rem;}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:1rem;}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0.85rem 1rem;box-shadow:inset 0 1px 0 var(--white);}
.metric-label{font-size:10px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;}
.metric-value{font-size:24px;font-weight:800;letter-spacing:-0.04em;}
.metric-value.good{color:var(--green);}
.exercise-block{padding:12px 0;border-bottom:1px solid var(--border-light);}
.exercise-block:last-child{border-bottom:none;}
.ex-main{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:flex-start;}
.ex-thumb{width:64px;height:64px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;}
.ex-thumb svg{width:54px;height:54px;}
.yt-link{position:absolute;bottom:3px;right:3px;background:#cc0000;border-radius:4px;padding:1px 5px;font-size:8px;color:#fff;font-weight:700;text-decoration:none;line-height:1.6;}
.ex-info{flex:1;min-width:0;}
.ex-name{font-size:13px;font-weight:600;letter-spacing:-0.01em;letter-spacing:-0.02em;}
.ex-sub{font-size:11px;color:var(--text-muted);margin-top:2px;}
.ex-controls{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;}
.ex-input{width:68px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--white);color:var(--text);font-size:13px;font-family:inherit;text-align:center;font-weight:500;}
.ex-input:focus{outline:none;border-color:var(--text);box-shadow:0 0 0 2px rgba(17,17,17,0.08);}
.feel-btns{display:flex;gap:4px;}
.feel-btn{padding:4px 10px;border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:11px;font-weight:600;background:var(--white);color:var(--text-muted);font-family:inherit;transition:all 0.15s;}
.feel-btn:hover{border-color:var(--text);color:var(--text);}
.feel-btn.fe{background:#DCFCE7;color:#15803d;border-color:#86efac;}
.feel-btn.fs{background:#DBEAFE;color:#1d4ed8;border-color:#93c5fd;}
.feel-btn.fh{background:#FEE2E2;color:#b91c1c;border-color:#fca5a5;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;letter-spacing:-0.01em;font-family:inherit;background:var(--white);color:var(--text);letter-spacing:-0.01em;transition:transform 0.2s cubic-bezier(0.22,1,0.36,1),box-shadow 0.2s,border-color 0.2s;}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:3px 3px 0 var(--text);border-color:var(--text);}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.btn.primary{background:var(--accent);color:var(--text);border-color:var(--accent);}
.btn.primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--text);}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:1rem;}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.01em;}
.badge-a{background:#DBEAFE;color:#1d4ed8;}
.badge-b{background:#FEF9C3;color:#854d0e;}
.badge-c{background:#DCFCE7;color:#15803d;}
.wk-btn.wc{background:#1d4ed8;color:#fff;border-color:#1d4ed8;}
.sec-hdr{font-size:10px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;padding:14px 0 6px;}
.wt-row{display:flex;align-items:center;gap:12px;margin-bottom:1rem;}
.wt-row label{font-size:13px;font-weight:600;letter-spacing:-0.01em;color:var(--text-muted);min-width:110px;}
.wt-in{width:96px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--white);color:var(--text);font-size:14px;font-weight:600;font-family:inherit;}
.wt-in:focus{outline:none;border-color:var(--text);box-shadow:0 0 0 2px rgba(17,17,17,0.08);}
.pain-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem;}
.pain-btn{padding:5px 12px;border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:12px;font-weight:500;background:var(--white);color:var(--text-muted);font-family:inherit;transition:all 0.15s;}
.pain-btn:hover{border-color:var(--text);color:var(--text);}
.pain-btn.on{background:#FEE2E2;color:#b91c1c;border-color:#fca5a5;}
.wk-toggle{display:flex;gap:8px;margin-bottom:1rem;}
.wk-btn{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;letter-spacing:-0.01em;font-family:inherit;background:var(--white);color:var(--text-muted);text-align:center;letter-spacing:-0.01em;transition:all 0.2s;}
.wk-btn:hover{border-color:var(--text);color:var(--text);}
.wk-btn.wa{background:var(--accent);color:var(--text);border-color:var(--text);}
.wk-btn.wb{background:#111;color:var(--accent);border-color:#111;}
.pb-wrap{background:var(--surface);border-radius:20px;height:8px;overflow:hidden;margin:8px 0 6px;border:1px solid var(--border);}
.pb{height:8px;border-radius:20px;background:var(--accent);transition:width 0.5s cubic-bezier(0.22,1,0.36,1);}
.ai-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem 1.1rem;font-size:13px;line-height:1.75;color:var(--text-muted);white-space:pre-wrap;margin-top:0.85rem;box-shadow:inset 0 1px 0 var(--white);}
.notes-in{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--white);color:var(--text);font-size:13px;resize:none;font-family:inherit;letter-spacing:-0.01em;}
.notes-in:focus{outline:none;border-color:var(--text);box-shadow:0 0 0 2px rgba(17,17,17,0.08);}
.chart-wrap{position:relative;width:100%;height:200px;margin-top:0.75rem;}
.hist-item{padding:12px 0;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:flex-start;}
.hist-item:last-child{border-bottom:none;}
.ai-banner{background:#FEF9C3;color:#854d0e;border-radius:12px;padding:0.85rem 1rem;font-size:13px;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid #fde68a;}
.dismiss{cursor:pointer;font-size:11px;font-weight:600;color:#854d0e;text-decoration:underline;background:none;border:none;font-family:inherit;}
.prog-ex{padding:10px 0;border-bottom:1px solid var(--border-light);display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;}
.prog-ex:last-child{border-bottom:none;}
.prog-thumb{width:52px;height:52px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;}
.prog-thumb svg{width:46px;height:46px;}
.chg-item{padding:10px 0;border-bottom:1px solid var(--border-light);font-size:13px;line-height:1.6;}
.chg-date{font-size:11px;color:var(--text-dim);margin-top:3px;font-weight:500;}
.ver{font-size:11px;color:var(--text-dim);text-align:right;margin-top:-0.5rem;margin-bottom:1rem;font-weight:500;}
#save-warning{width:100%;background:#FEF9C3;color:#854d0e;border:1px solid #fde68a;border-radius:10px;padding:8px 12px;font-size:12px;line-height:1.5;margin-top:6px;}
.wellness-label{font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;margin-top:0.75rem;}
.wellness-label:first-of-type{margin-top:0;}
.phase-btns,.energy-btns{display:flex;gap:6px;flex-wrap:wrap;}
.phase-btn,.energy-btn{padding:5px 14px;border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:12px;font-weight:600;background:var(--white);color:var(--text-muted);font-family:inherit;transition:all 0.15s;}
.phase-btn:hover,.energy-btn:hover{border-color:var(--text);color:var(--text);}
.phase-btn.pm{background:#FEE2E2;color:#b91c1c;border-color:#fca5a5;}
.phase-btn.pf{background:#DCFCE7;color:#15803d;border-color:#86efac;}
.phase-btn.pl{background:#EDE9FE;color:#6d28d9;border-color:#c4b5fd;}
.energy-btn.es{background:#DCFCE7;color:#15803d;border-color:#86efac;}
.energy-btn.en{background:var(--surface);color:var(--text);border-color:var(--border);}
.energy-btn.ew{background:#FEF3C7;color:#92400e;border-color:#fcd34d;}
</style>
</head>

Goals: lose weight to reach her goal (she sets this herself in the app), reduce tummy, improve posture, balance proportions (34F bra — through exercise not surgery).
Knee issues: knee-safe exercises only, build knee strength not aggravate.
Health: she has endometriosis. On high-pain or endo flare-up days, significantly reduce intensity — prioritise gentle movement, stretching, or rest. Never push through endo pain. Period and cramp days should also be treated with extra care — lower intensity, avoid heavy core compression.
4 sessions/week Mon/Wed/Fri/weekend, rotating A/B/C. Workout A = upper body & core, B = lower body & glutes, C = full body. 45 mins active. Not a gym lover.
IMPORTANT programme rule: Workout C must never repeat exercises or movement patterns already used in A or B that same week. Specifically — C must not include: squat/lunge patterns (those belong to B), overhead or floor pressing (belongs to A), vertical pulling/curls (belongs to A), supine floor core work like dead bug/hollow body/snow angel (belongs to A), side plank variants (belongs to B), donkey kicks or hip abductions (belongs to B). C should use movement patterns not covered in A or B: hip-hinge (e.g. RDL), horizontal push (e.g. push-up), horizontal pull (e.g. bent-over row), quadruped core (e.g. bird dog), isolation work not duplicated elsewhere, and loaded carries distinct from A's.
Food: she does NOT count calories — give no numbers. Assess quality, protein, veg/fibre, balance. Note that anti-inflammatory foods are particularly beneficial given her endo.
Bust reduction via exercise is not directly possible; focus on posture, back/shoulder strength, overall fat loss.
Cycle phase guidance: when menstrual phase — reduce intensity, gentle movement, avoid heavy loading and strong core compression; when follicular phase — energy is building, good time for progression and new challenges; when luteal phase — may feel heavier or fatigued, focus on technique over load, lower volume if needed.
Energy level guidance: if feeling weak — cut sets or load by ~20–30%, focus on form; if feeling normal — follow plan as written; if feeling strong — encourage pushing the upper end of weight ranges.
Always factor in any stated weaknesses (e.g. tight hips, low motivation) with targeted modifications.
Be warm, specific, practical, encouraging. Never judge food choices harshly.`;

async function ld(){
  try{

      const p=JSON.parse(raw);
      if(!p.goalWeight)p.goalWeight=null;
      // v6 migration: reset plan to fresh exercises (changed May 2026)
      if(!p.planVersion||p.planVersion<6){p.plan=JSON.parse(JSON.stringify(PLAN0));p.planVersion=6;}
      if(p.planVersion<7){if(!p.plan.C)p.plan.C=JSON.parse(JSON.stringify(PLAN0.C));p.planVersion=7;}
      if(p.planVersion<8){p.plan.C=JSON.parse(JSON.stringify(PLAN0.C));p.planVersion=8;}
      return p;
    }
  }catch(e){}
  return EMPTY_ST();
}

async function saveDailyStats(){

  if(idx>=0)st.weights[idx].weight=w;
  else st.weights.push({date:new Date().toISOString(),weight:w});

async function saveSess(){
  const today=new Date().toISOString().slice(0,10);
  // Warn if a session already exists for today
  const existing=st.sessions.filter(s=>s.date.slice(0,10)===today);
  if(existing.length>0){
    // Show inline warning rather than saving silently
    const warn=document.getElementById('save-warning');
    if(warn){warn.style.display='block';return;}
    return;
  }
  const sess={id:Date.now(),date:new Date().toISOString(),type:wk,exercises:JSON.parse(JSON.stringify(sd)),pain:[...pain],notes,weight:cw?parseFloat(cw):null,cyclePhase:cyclePhase||null,energyLevel:energyLevel||null};
  if(cw){const w=parseFloat(cw);const idx=st.weights.findIndex(e=>e.date.slice(0,10)===today);if(idx>=0)st.weights[idx].weight=w;else st.weights.push({date:sess.date,weight:w});}
  st.sessions.push(sess);
  const saveResult=await sv(st);
  notes='';cw='';pain=[];sd={};air='';cyclePhase=null;energyLevel=null;
  if(st.sessions.length%3===0)aiReview();
  // Show confirmation in the save button area
  savedFlash=true;render();
  setTimeout(()=>{savedFlash=false;render();},3000);
}

async function askAi(){
  ail=true;render();
  const wellness=[cyclePhase?'Cycle phase: '+cyclePhase:'',energyLevel?'Energy: '+energyLevel:''].filter(Boolean).join('. ');
  const p='Workout '+wk+'. '+(wellness?wellness+'. ':'')+' Pain: '+(pain.join(',')||'none')+'. Data: '+JSON.stringify(sd)+'. Notes: '+(notes||'none')+'. Recent: '+st.sessions.slice(-4).map(s=>new Date(s.date).toDateString()+' W'+s.type+' pain:'+(s.pain.join(',')||'none')).join(' | ')+'. Give 3-5 sentence personalised coaching response. If cycle phase, energy level or weaknesses are provided, give specific adjustments for today\'s session accordingly.';
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:SYS,messages:[{role:'user',content:p}]})});
    const d=await r.json();air=d.content?.find(b=>b.type==='text')?.text||'No response.';
  }catch(e){air='Could not connect. Please try again.';}
  ail=false;render();
}

async function aiReview(){
  const sess=st.sessions.slice(-6);
  const planSummary=Object.entries(st.plan).map(([wk,pd])=>
    wk+': '+pd.blocks.map(b=>b.name+' ['+b.exercises.map(e=>e.id+'='+e.name).join(', ')+']').join('; ')
  ).join('\n');
  const p='Review last '+sess.length+' sessions and suggest 1-3 programme adaptations.\n\nSessions: '+sess.map(s=>new Date(s.date).toDateString()+' W'+s.type+' pain:'+(s.pain.join(',')||'none')+' feels:'+JSON.stringify(Object.values(s.exercises).map(e=>e.feel))+' notes:'+(s.notes||'none')).join(' | ')+'\n\nCurrent plan:\n'+planSummary+'\n\nReturn ONLY a valid JSON object (no markdown):\n{"summary":"2-4 sentence friendly explanation of your suggestions","changes":[{"workout":"A, B or C","blockName":"copy block name exactly from plan above","exerciseId":"copy id exactly from plan above","exerciseName":"copy exercise name exactly from plan above","updates":{"name":"new name if changing","sets":3,"reps":"new reps","wr":"new weight range","dw":"new default weight","u":"kg or empty"},"reason":"why this change"}]}\nOnly include fields in updates that are actually changing. Copy blockName, exerciseId and exerciseName character-for-character from the plan above.';
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1200,system:SYS,messages:[{role:'user',content:p}]})});
    const d=await r.json();
    const raw=d.content?.find(b=>b.type==='text')?.text||'';
    const jsonStr=raw.replace(/^```[a-z]*\n?/,'').replace(/\n?```$/,'').trim();
    const parsed=JSON.parse(jsonStr);
    if(parsed.summary||parsed.changes){
      st.pendingAi={date:new Date().toISOString(),text:parsed.summary||'Programme changes suggested',changes:parsed.changes||[]};
      await sv(st);render();
    }
  }catch(e){}
}

async function applyAiPlanChange(text){
  const norm=s=>(s||'').toLowerCase().replace(/[^a-z0-9]/g,' ').replace(/\s+/g,' ').trim();
  const changes=st.pendingAi?.changes||[];
  let applied=0;
  changes.forEach(ch=>{
    const workout=st.plan[ch.workout];if(!workout)return;
    workout.blocks.forEach(block=>{
      if(block.name!==ch.blockName&&norm(block.name)!==norm(ch.blockName))return;
      block.exercises.forEach(ex=>{
        const idMatch=ex.id===ch.exerciseId;
        const nameMatch=norm(ex.name)===norm(ch.exerciseName);
        if(!idMatch&&!nameMatch)return;
        Object.assign(ex,ch.updates);applied++;
        st.planChanges.push({date:new Date().toISOString(),text:ch.reason||ch.summary||'Plan updated',source:'AI coach'});
      });
    });
  });
  st.pendingAi=null;
  await sv(st);render();
  toast(applied?'Plan updated — '+applied+' exercise'+(applied>1?'s':'')+' changed':'No matching exercises found — change logged');
  if(!applied&&text){st.planChanges.push({date:new Date().toISOString(),text,source:'AI coach'});await sv(st);}
}

function dedupByDate(arr,valKey){
  const seen={};arr.forEach(e=>{seen[e.date.slice(0,10)]=e;});
  return Object.values(seen).sort((a,b)=>a.date.localeCompare(b.date));
}

function rProgress(c){
  const wts=dedupByDate(st.weights,'weight'),sess=st.sessions;

  const goal=st.goalWeight||null;
  const lost=sw&&curw?+(sw-curw).toFixed(1):0;
  const toGoal=goal&&curw?Math.max(0,+(curw-goal).toFixed(1)):null;
  const totalToLose=sw&&goal?+(sw-goal).toFixed(1):null;
  const prog=totalToLose&&totalToLose>0&&lost>0?Math.min(100,Math.round((lost/totalToLose)*100)):0;

  // Goal weight setting card — always shown at top
  const gc2=document.createElement('div');gc2.className='card';
  gc2.innerHTML='<div class="card-title">Goal weight</div>';
  const goalRow=document.createElement('div');goalRow.className='wt-row';
  goalRow.innerHTML='<label>My goal weight</label>';
  const goalIn=document.createElement('input');goalIn.type='number';goalIn.className='wt-in';goalIn.placeholder='e.g. 63';goalIn.step='0.1';goalIn.value=st.goalWeight||'';
  goalIn.oninput=e=>{st.goalWeight=e.target.value?parseFloat(e.target.value):null;};
  const goalSave=document.createElement('button');goalSave.className='btn primary';goalSave.style.cssText='padding:6px 14px;font-size:13px;';goalSave.textContent='Update';
  goalSave.onclick=async()=>{await sv(st);goalSave.textContent='✓ Saved';goalSave.style.background='#1D9E75';goalSave.style.borderColor='#1D9E75';setTimeout(()=>{goalSave.textContent='Update';goalSave.style.background='';goalSave.style.borderColor='';},2000);render();};
  goalRow.appendChild(goalIn);goalRow.appendChild(goalSave);gc2.appendChild(goalRow);
  if(!st.goalWeight){const hint=document.createElement('div');hint.style.cssText='font-size:11px;color:var(--text-dim);margin-top:4px;';hint.textContent='Set your goal weight to track progress accurately.';gc2.appendChild(hint);}
  c.appendChild(gc2);

  // Metrics
  const mg=document.createElement('div');mg.className='metric-grid';
  [['Sessions',sess.length],['Current weight',curw?curw+' kg':'—'],['Lost so far',lost>0?lost+' kg':'0 kg'],['To goal',toGoal!==null?toGoal+' kg':'—']].forEach(([l,v],i)=>{
    const m=document.createElement('div');m.className='metric';m.innerHTML='<div class="metric-label">'+l+'</div><div class="metric-value'+(i===2&&lost>0?' good':'')+'">'+v+'</div>';mg.appendChild(m);
  });

    c.appendChild(pc);
  }
  if(wts.length>1){const wc=document.createElement('div');wc.className='card';wc.innerHTML='<div class="card-title">Weight trend</div><div class="chart-wrap"><canvas id="weightChart"></canvas></div>';c.appendChild(wc);}
  if(sess.length>1){const fc=document.createElement('div');fc.className='card';fc.innerHTML='<div class="card-title">Sessions per week</div><div class="chart-wrap"><canvas id="sessionsChart"></canvas></div>';c.appendChild(fc);}
  // Import / Export card
  const iec=document.createElement('div');iec.className='card';

    fi.onchange=async e=>{

    if(s.weight)right.innerHTML+='<div style="font-size:14px;font-weight:700;letter-spacing:-0.02em;color:var(--green);">'+s.weight+'kg</div>';
    const del=document.createElement('button');del.style.cssText='font-size:11px;color:#cc4444;background:none;border:none;cursor:pointer;padding:0;margin-top:4px;';del.textContent='Delete';
    del.onclick=()=>{del.textContent='Sure?';const no=document.createElement('button');no.style.cssText='margin-left:4px;font-size:11px;color:var(--text-dim);background:none;border:none;cursor:pointer;';no.textContent='No';no.onclick=e=>{e.stopPropagation();del.textContent='Delete';no.remove();};del.after(no);
      del.onclick=async()=>{const idx=st.sessions.indexOf(s);if(idx>=0)st.sessions.splice(idx,1);await sv(st);render();};};
    right.appendChild(del);item.appendChild(left);item.appendChild(right);hc.appendChild(item);

  c.appendChild(hc);

function toast(msg,isError){
  // Remove any existing toast
  const old=document.getElementById('app-toast');if(old)old.remove();
  const t=document.createElement('div');t.id='app-toast';
  t.style.cssText='position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:'+(isError?'#cc4444':'#1a1a1a')+';color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:99999;box-shadow:0 4px 16px rgba(0,0,0,0.25);white-space:nowrap;max-width:90vw;text-align:center;';
  t.textContent=msg;
  (document.getElementById('root')||document.body).appendChild(t);
  setTimeout(()=>{t.style.transition='opacity 0.4s';t.style.opacity='0';setTimeout(()=>t.remove(),400);},2800);
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function formatFoodAnalysis(text){
  if(!text)return '';
  let html='';
  const lines=text.split('\n').map(l=>l.trim()).filter(l=>l.length);
  lines.forEach(line=>{
    if(line.toUpperCase().startsWith('MEALS:')){
      html+='<div style="font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin:8px 0 4px;">Meals</div>';
    } else if(line.toUpperCase().startsWith('OVERALL:')){
      html+='<div style="font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin:10px 0 4px;">Overall</div>';
    } else if(line.startsWith('✅')){
      const txt=line.replace(/^✅\s*/,'');
      html+='<div style="display:flex;gap:8px;align-items:flex-start;background:#f0fdf4;border-left:3px solid var(--green);border-radius:0 6px 6px 0;padding:6px 10px;margin:6px 0;font-size:12px;line-height:1.5;"><span style="flex-shrink:0;">✅</span><span>'+escHtml(txt)+'</span></div>';
    } else if(line.startsWith('💡')){
      const txt=line.replace(/^💡\s*/,'');
      html+='<div style="display:flex;gap:8px;align-items:flex-start;background:#fff9ed;border-left:3px solid #d97706;border-radius:0 6px 6px 0;padding:6px 10px;margin:6px 0;font-size:12px;line-height:1.5;"><span style="flex-shrink:0;">💡</span><span>'+escHtml(txt)+'</span></div>';
    } else if(line.startsWith('•')||line.startsWith('-')){
      const content=line.replace(/^[•\-]\s*/,'');
      const colonIdx=content.indexOf(':');
      if(colonIdx>0&&colonIdx<35){
        const label=content.slice(0,colonIdx);
        const val=content.slice(colonIdx+1).trim();
        html+='<div style="display:flex;gap:6px;padding:3px 0;font-size:12px;line-height:1.5;"><span style="color:#aaa;flex-shrink:0;margin-top:1px;">•</span><span><strong>'+escHtml(label)+':</strong> '+escHtml(val)+'</span></div>';
      } else {
        html+='<div style="display:flex;gap:6px;padding:3px 0;font-size:12px;line-height:1.5;"><span style="color:#aaa;flex-shrink:0;margin-top:1px;">•</span><span>'+escHtml(content)+'</span></div>';
      }
    } else {
      html+='<div style="font-size:12px;line-height:1.6;padding:2px 0;color:#666;">'+escHtml(line)+'</div>';
    }
  });
  return html||escHtml(text);
}
